<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A fun truck delivery game with multiple game modes">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Truck Game">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Truck Game</title>
  <link rel="manifest" href="manifest.json">
  
  <!-- Firebase Configuration - Load synchronously before anything else -->
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  
  <!-- Initialize Firebase immediately -->
  <script src="firebase-init.js"></script>
  
  <script>
    // Ensure Firebase is ready before Flutter starts
    if (typeof firebase === 'undefined') {
      console.error('[WEB] Firebase failed to load - check your internet connection');
    } else {
      console.log('[WEB] Firebase SDK loaded successfully');
    }
  </script>
</head>
<body>
  <script>
    // The value below is injected by flutter build, do not touch.
    const serviceWorkerVersion = ""3157036063"";
  </script>
  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
