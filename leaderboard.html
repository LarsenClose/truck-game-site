<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truck: Dig & Drive - Global Leaderboard</title>
    <meta name="description" content="View the global leaderboard for Truck: Dig & Drive. See top players and compete for the highest score!">
    
    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #000;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        header {
            background-color: rgba(255, 165, 0, 0.1);
            border-bottom: 2px solid #FFA500;
            padding: 20px;
            text-align: center;
        }
        
        h1 {
            color: #FFA500;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        
        .nav-links {
            margin-top: 15px;
        }
        
        .nav-links a {
            color: #FFA500;
            text-decoration: none;
            margin: 0 15px;
            font-size: 18px;
            transition: color 0.3s;
        }
        
        .nav-links a:hover {
            color: #FFB84D;
            text-decoration: underline;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            flex: 1;
        }
        
        .mode-selector {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        
        .mode-btn {
            background-color: rgba(255, 165, 0, 0.2);
            color: #FFA500;
            border: 2px solid #FFA500;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        .mode-btn:hover {
            background-color: rgba(255, 165, 0, 0.3);
        }
        
        .mode-btn.active {
            background-color: #FFA500;
            color: #000;
            font-weight: bold;
        }
        
        .leaderboard-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        
        .leaderboard-section {
            background-color: rgba(255, 165, 0, 0.05);
            border: 1px solid #FFA500;
            border-radius: 12px;
            padding: 20px;
        }
        
        .section-title {
            color: #FFA500;
            font-size: 1.5em;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .score-list {
            list-style: none;
        }
        
        .score-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            margin: 5px 0;
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            transition: background-color 0.3s;
        }
        
        .score-item:hover {
            background-color: rgba(255, 165, 0, 0.1);
        }
        
        .rank {
            font-weight: bold;
            color: #FFA500;
            min-width: 40px;
        }
        
        .rank.gold { color: #FFD700; font-size: 1.2em; }
        .rank.silver { color: #C0C0C0; font-size: 1.1em; }
        .rank.bronze { color: #CD7F32; font-size: 1.05em; }
        
        .player-name {
            flex: 1;
            margin: 0 10px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .score {
            font-weight: bold;
            color: #4CAF50;
        }
        
        .loading {
            text-align: center;
            padding: 50px;
            color: #FFA500;
        }
        
        .error {
            text-align: center;
            padding: 50px;
            color: #f44336;
        }
        
        .spinner {
            border: 3px solid rgba(255, 165, 0, 0.3);
            border-top: 3px solid #FFA500;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        footer {
            background-color: rgba(255, 165, 0, 0.1);
            border-top: 1px solid #FFA500;
            padding: 20px;
            text-align: center;
            color: #888;
        }
        
        @media (max-width: 600px) {
            h1 { font-size: 1.8em; }
            .mode-btn { padding: 8px 15px; font-size: 14px; }
            .leaderboard-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header>
        <h1>🚚 Truck: Dig & Drive - Leaderboard</h1>
        <div class="nav-links">
            <a href="/truck-game-site/">Home</a>
            <a href="/truck-game-site/play/">Play Game</a>
            <a href="https://github.com/LarsenClose/truck-game-site">GitHub</a>
        </div>
    </header>
    
    <div class="container">
        <div class="mode-selector">
            <button class="mode-btn active" data-mode="all">All Modes</button>
            <button class="mode-btn" data-mode="classic">Classic</button>
            <button class="mode-btn" data-mode="speed">Speed Run</button>
            <button class="mode-btn" data-mode="endurance">Endurance</button>
            <button class="mode-btn" data-mode="multiPlane">Multi-Plane</button>
        </div>
        
        <div id="leaderboard-container" class="leaderboard-container">
            <div class="loading">
                <div class="spinner"></div>
                <p>Loading leaderboard...</p>
            </div>
        </div>
    </div>
    
    <footer>
        <p>© 2025 Truck: Dig & Drive | Free to Play | No Ads</p>
    </footer>
    
    <script>
        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCA0w6VSqTB4OkH8pabGyqFBtVmSAmjzKQ",
            authDomain: "truck-game-global.firebaseapp.com",
            projectId: "truck-game-global",
            storageBucket: "truck-game-global.firebasestorage.app",
            messagingSenderId: "246957782860",
            appId: "1:246957782860:web:aa16d48bfcef97907541e9"
        };
        
        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        
        let currentMode = null;
        let currentUser = null;
        
        // Sign in anonymously to access the leaderboard
        auth.signInAnonymously()
            .then((credential) => {
                currentUser = credential.user;
                console.log('Signed in anonymously:', currentUser.uid);
                loadLeaderboard();
            })
            .catch((error) => {
                console.error('Auth error:', error);
                showError('Unable to connect to leaderboard. Please try again later.');
            });
        
        // Mode selector handlers
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentMode = btn.dataset.mode === 'all' ? null : btn.dataset.mode;
                loadLeaderboard();
            });
        });
        
        function loadLeaderboard() {
            const container = document.getElementById('leaderboard-container');
            container.innerHTML = '<div class="loading"><div class="spinner"></div><p>Loading leaderboard...</p></div>';
            
            // Build query
            let query = db.collection('highscores')
                .orderBy('score', 'desc')
                .limit(100);
            
            if (currentMode) {
                query = query.where('game_mode', '==', currentMode);
            }
            
            // Fetch scores
            query.get()
                .then(async (snapshot) => {
                    const scores = [];
                    const playerIds = new Set();
                    
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        scores.push(data);
                        playerIds.add(data.player_id);
                    });
                    
                    // Fetch player names
                    const playerNames = {};
                    for (const playerId of playerIds) {
                        try {
                            const playerDoc = await db.collection('players').doc(playerId).get();
                            if (playerDoc.exists) {
                                playerNames[playerId] = playerDoc.data().username || 'Anonymous';
                            } else {
                                playerNames[playerId] = 'Anonymous';
                            }
                        } catch (e) {
                            playerNames[playerId] = 'Anonymous';
                        }
                    }
                    
                    displayLeaderboard(scores, playerNames);
                })
                .catch(error => {
                    console.error('Error loading leaderboard:', error);
                    showError('Failed to load leaderboard. Please try again.');
                });
        }
        
        function displayLeaderboard(scores, playerNames) {
            const container = document.getElementById('leaderboard-container');
            
            if (scores.length === 0) {
                container.innerHTML = '<div class="error">No scores yet. Be the first to play!</div>';
                return;
            }
            
            // Group scores by game mode if showing all modes
            const groupedScores = {};
            
            if (!currentMode) {
                scores.forEach(score => {
                    const mode = score.game_mode || 'classic';
                    if (!groupedScores[mode]) {
                        groupedScores[mode] = [];
                    }
                    groupedScores[mode].push(score);
                });
            } else {
                groupedScores[currentMode] = scores;
            }
            
            // Display leaderboards
            container.innerHTML = '';
            
            Object.entries(groupedScores).forEach(([mode, modeScores]) => {
                const section = document.createElement('div');
                section.className = 'leaderboard-section';
                
                const title = document.createElement('h2');
                title.className = 'section-title';
                title.textContent = formatModeName(mode) + ' Top Players';
                section.appendChild(title);
                
                const list = document.createElement('ul');
                list.className = 'score-list';
                
                modeScores.slice(0, 20).forEach((score, index) => {
                    const item = document.createElement('li');
                    item.className = 'score-item';
                    
                    const rank = document.createElement('span');
                    rank.className = 'rank';
                    if (index === 0) rank.classList.add('gold');
                    else if (index === 1) rank.classList.add('silver');
                    else if (index === 2) rank.classList.add('bronze');
                    rank.textContent = '#' + (index + 1);
                    
                    const name = document.createElement('span');
                    name.className = 'player-name';
                    name.textContent = playerNames[score.player_id] || 'Anonymous';
                    
                    const scoreSpan = document.createElement('span');
                    scoreSpan.className = 'score';
                    scoreSpan.textContent = formatScore(score.score);
                    
                    item.appendChild(rank);
                    item.appendChild(name);
                    item.appendChild(scoreSpan);
                    list.appendChild(item);
                });
                
                section.appendChild(list);
                container.appendChild(section);
            });
        }
        
        function formatModeName(mode) {
            const modeNames = {
                'classic': 'Classic',
                'speed': 'Speed Run',
                'endurance': 'Endurance',
                'multiPlane': 'Multi-Plane'
            };
            return modeNames[mode] || 'Classic';
        }
        
        function formatScore(score) {
            return score.toLocaleString();
        }
        
        function showError(message) {
            const container = document.getElementById('leaderboard-container');
            container.innerHTML = `<div class="error">${message}</div>`;
        }
    </script>
</body>
</html>
